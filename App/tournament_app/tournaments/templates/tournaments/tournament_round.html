{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ tournament.name }}</title>
</head>
<body>
    <h1>{{ tournament.name }} Round {{ hosting.current_round }}<h1>
    {% for match in matches %}
    <p>{{ match.player_1.name }} vs {{ match.player_2.name }}</p>
    {% endfor %}

    <p>{{ round_num }}</p>
    <a href="{% url 'tournaments:round_end' tournament.uuid round_num  %}"><button>End Round</button></a>
</body>
</html>
