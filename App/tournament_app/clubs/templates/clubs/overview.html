{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Clubs</title>
</head>
<body>
    <h1>All Clubs</h1>
    <ul>
        {% for club in clubs %}
        <li>
            Name: <a href="{% url 'clubs:club_details' club.uuid %}"> {{ club.name }} </a>
            Website: {{ club.website }}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
