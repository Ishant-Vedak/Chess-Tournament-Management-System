{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ request.user.username }}'s Club</title>
</head>
<body>
    <h1>{{ request.user.username }}'s Club</h1>
    {% if clubs %}
        {% for club in clubs %}
        <p>{{ club.name }}</p>
        {% endfor %}
    {% else %}
        <p> No Club</p>
    {% endif %}
    <a href="{% url 'clubs:create_club' %}"><button>Create Club</button></a>
</body>
</html>
